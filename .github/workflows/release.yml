name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 150
    env:
      CARGO_TERM_COLOR: always
    # Every action, GitHub's own included, is pinned to the commit of a release
    # tag: this job can write releases, and the last step holds the update
    # signing key. Dependabot moves each pin to the next tagged release. Rust is
    # installed with the runner's own rustup rather than an action, so no code
    # outside these pins runs here.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 22, cache: pnpm }
      - run: rustup toolchain install stable --profile minimal --no-self-update && rustup default stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with: { workspaces: src-tauri }
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~\AppData\Local\butterfly-speak\vendor
          key: sherpa-${{ hashFiles('scripts/vendor-sherpa.ps1') }}
      - run: powershell -ExecutionPolicy Bypass -File scripts\vendor-sherpa.ps1 -GithubEnv
      - run: pnpm install --frozen-lockfile
      # The release body becomes latest.json's `notes`, which the app shows as
      # the update notes, so it comes from RELEASE_NOTES.md at the tagged
      # commit. Its first line must be exactly "Butterfly Speak <version>".
      - id: notes
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          [ "$(head -n 1 RELEASE_NOTES.md | tr -d '\r')" = "Butterfly Speak $version" ] || { echo "RELEASE_NOTES.md is not for $version"; exit 1; }
          { echo 'body<<RELEASE_NOTES_EOF'; cat RELEASE_NOTES.md; echo; echo 'RELEASE_NOTES_EOF'; } >> "$GITHUB_OUTPUT"
      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        timeout-minutes: 120
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Butterfly Speak ${{ github.ref_name }}
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: true
          includeUpdaterJson: true
